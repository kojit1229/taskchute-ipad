<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- v151: 既定は"#111216"(ダーク既定、K指示2026-07-27)。実際の色は下の同期スクリプトが
         起動直後に解決結果へ上書きする(以後はapp.jsのapplyTheme()が設定変更・OS追従の
         都度更新する)。 -->
    <meta name="theme-color" content="#111216" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- v151レビュー対応(必須2): theme-colorメタはiOS standalone起動時のステータスバーには
         効かない(Safari/ホームブラウザだけが見る)。ステータスバーの色は
         apple-mobile-web-app-status-bar-styleだけが制御するため"black"に固定する。
         "black-translucent"はコンテンツがステータスバー領域まで潜り込みsafe-area-inset対応が
         別途必要になるため、既存レイアウトへの副作用を避けて不採用。 -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="TaskChute Journal" />
    <title>TaskChute Journal</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./assets/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./assets/icon.svg" />
    <!-- v151: ダークモード既定化のフラッシュ防止。app.js(type="module"は非同期・遅延実行のため
         初回ペイントに間に合わない)より前に、html要素へdata-theme属性を同期的に付与する。
         判定ロジックはapp.jsのresolveTheme()/applyTheme()と**構造まで完全一致**させて複製している
         (state.settings.theme: "light"|"dark"|"auto"、既定"dark"。"auto"はOSのprefers-color-scheme
         に従う)。STORAGE_KEYの文字列・THEME_COLOR_BY_MODEの値・分岐の形(mode!=="auto"ならlight/dark
         を直接判定、autoのときだけmatchMediaを見る)は、app.jsのresolveTheme()/applyTheme()/
         THEME_COLOR_BY_MODEと手動で同期を保つこと(ここはモジュール読込前の素のscriptのため
         importできない。どちらかだけ改修すると2箇所がドリフトするため、変更時は両方を見比べること)。
         v151レビュー対応(必須4): meta[theme-color]もこの時点で解決済みテーマの値へ更新する
         (従来はdata-theme属性しか更新しておらず、light解決時にステータスバー相当の色が
         一瞬ダークのまま=theme-colorメタの既定値#111216が残る問題があった)。 -->
    <script>
      (function () {
        var THEME_COLOR_BY_MODE = { light: "#f7f7fa", dark: "#111216", cockpit: "#050a14" };
        function resolveTheme(mode) {
          if (mode !== "auto") return ["light", "dark", "cockpit"].includes(mode) ? mode : "dark";
          return (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
        }
        try {
          var raw = localStorage.getItem("taskchute-journal-pwa-state-v1");
          var theme = "dark";
          if (raw) {
            var parsed = JSON.parse(raw);
            var t = parsed && parsed.settings && parsed.settings.theme;
            if (["light", "dark", "cockpit", "auto"].includes(t)) theme = t;
          }
          var resolved = resolveTheme(theme);
          document.documentElement.setAttribute("data-theme", resolved);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", THEME_COLOR_BY_MODE[resolved]);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
    <link rel="stylesheet" href="./styles.css" />
    <!-- v38: marked はリポジトリ同梱に変更(CDN依存・改ざんリスクを排除、オフラインでも確実に動作) -->
    <script src="./marked.min.js"></script>
  </head>
  <body>
    <div id="app" class="app-shell" aria-live="polite">
      <aside id="sidebar" class="sidebar"></aside>
      <main id="main" class="main-pane"></main>
      <aside id="timelineRail" class="timeline-rail"></aside>
      <nav id="bottomNav" class="bottom-nav"></nav>
    </div>
    <div id="modalRoot" class="modal-root" aria-hidden="true"></div>
    <div id="toast" class="toast" role="status"></div>
    <div id="trackToast" class="twy-toast" role="status" hidden></div>
    <!-- v273: app.js自身がlink失敗する版ズレを直すため、依存を持たないclassic scriptをmoduleより先に置く。
         scriptの取得失敗とwindowへ届くlink errorはブラウザ差があるため両方をboot中だけ捕捉する。
         案内UIはapp.js/styles.cssが読めない状態でも表示できるよう、このbootstrapだけで完結させる。 -->
    <script>
      (function () {
        var FLAG = "tcj-sw-self-heal-attempted-v1";
        var CACHE_PREFIX = "taskchute-journal-pwa-";
        var APP_SCOPE = new URL("./", location.href).href;
        var handlingFailure = false;

        function showRecoveryGuidance(reason) {
          var box = document.createElement("div");
          box.setAttribute("role", "alert");
          box.setAttribute("data-tcj-recovery", reason);
          box.style.cssText =
            "position:fixed;inset:0;z-index:99999;background:#111216;color:#f2f2f5;" +
            "display:flex;align-items:center;justify-content:center;padding:24px;" +
            "font-family:-apple-system,sans-serif;text-align:center;line-height:1.7;";
          var msg = reason === "offline"
            ? "通信が切れているため読み込めませんでした。通信を確認してからもう一度開いてください。"
            : "読み込みに失敗しました。復旧しない場合は「設定 > アプリ > Safari > 履歴とWebサイトデータを消去」を行ってから、もう一度アプリを開いてください。";
          box.innerHTML =
            '<div style="max-width:320px"><p style="margin:0 0 16px">' + msg + "</p>" +
            '<button type="button" data-action="tcj-heal-retry" style="padding:10px 20px;border-radius:8px;' +
            'border:none;background:#3d7fff;color:#fff;font-size:16px">もう一度試す</button></div>';
          document.body.appendChild(box);
          document.addEventListener("click", function (event) {
            if (event.target.closest('[data-action="tcj-heal-retry"]')) window.location.reload();
          });
        }

        function cleanupAppStorage() {
          if (typeof caches === "undefined") return Promise.reject(new Error("Cache API unavailable"));
          var cacheCleanup = caches.keys().then(function (keys) {
            return Promise.all(keys.filter(function (key) {
              return key.indexOf(CACHE_PREFIX) === 0;
            }).map(function (key) { return caches.delete(key); }));
          });
          var swCleanup = navigator.serviceWorker
            ? navigator.serviceWorker.getRegistrations().then(function (registrations) {
                return Promise.all(registrations.filter(function (registration) {
                  return registration.scope.indexOf(APP_SCOPE) === 0;
                }).map(function (registration) { return registration.unregister(); }));
              })
            : Promise.resolve();
          return Promise.all([cacheCleanup, swCleanup]);
        }

        function appEntryIsReachable() {
          return fetch(new URL("./app.js", location.href), { cache: "no-store", credentials: "same-origin" })
            .then(function (response) {
              return response.ok && /(?:java|ecma)script/i.test(response.headers.get("content-type") || "");
            }).catch(function () { return false; });
        }

        function handleBootFailure(checkReachability) {
          if (handlingFailure) return;
          handlingFailure = true;
          var attempted = false;
          var storageAvailable = true;
          try { attempted = sessionStorage.getItem(FLAG) === "1"; } catch (e) { storageAvailable = false; }
          if (!storageAvailable) {
            showRecoveryGuidance("retry-failed");
            return;
          }
          if (!navigator.onLine || attempted) {
            showRecoveryGuidance(attempted ? "retry-failed" : "offline");
            return;
          }
          var guarded = false;
          try {
            sessionStorage.setItem(FLAG, "1");
            guarded = sessionStorage.getItem(FLAG) === "1";
          } catch (e) {}
          if (!guarded) {
            showRecoveryGuidance("retry-failed");
            return;
          }
          var reachable = checkReachability ? appEntryIsReachable() : Promise.resolve(true);
          reachable.then(function (canRepair) {
            if (!canRepair) {
              showRecoveryGuidance("retry-failed");
              return;
            }
            cleanupAppStorage().then(function () {
              window.location.reload();
            }).catch(function () { showRecoveryGuidance("retry-failed"); });
          });
        }

        function isModuleLinkError(event) {
          var message = event.message || (event.error && event.error.message) || "";
          var syntaxError = !event.error || event.error.name === "SyntaxError";
          var sourceInApp = !event.filename || new URL(event.filename, location.href).href.indexOf(APP_SCOPE) === 0;
          return syntaxError && sourceInApp && (
            /^(?:Uncaught )?(?:SyntaxError: )?The requested module .+ does not provide an export named .+$/i.test(message) ||
            /^(?:Uncaught )?(?:SyntaxError: )?Importing binding name .+ is not found\.?$/i.test(message)
          );
        }

        function onBootError(event) {
          if (event.target && event.target.id === "appEntry") handleBootFailure(true);
          else if (isModuleLinkError(event)) handleBootFailure(false);
        }
        function onAppEntryLoad(event) {
          if (!event.target || event.target.id !== "appEntry") return;
          window.removeEventListener("error", onBootError, true);
          document.removeEventListener("load", onAppEntryLoad, true);
        }
        window.addEventListener("error", onBootError, true);
        document.addEventListener("load", onAppEntryLoad, true);
      })();
    </script>
    <script type="module" src="./app.js" id="appEntry"></script>
  </body>
</html>
