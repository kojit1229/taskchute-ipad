name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # playwright-core は CLI を同梱している(ブラウザだけ取得)
      - run: npx playwright-core install --with-deps chromium
      - run: npm test
