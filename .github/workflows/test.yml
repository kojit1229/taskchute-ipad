name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    name: e2e shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Tokyo  # 検査環境の前提: Kの実環境(日本時間)に合わせる(taskchute/CLAUDE.md 2026-09-08)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # playwright-core は CLI を同梱している(ブラウザだけ取得)
      - run: npx playwright-core install --with-deps chromium
      - run: npm test -- --shard=${{ matrix.shard }}/4
