<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="TaskChute Journal">
  <!-- v56: manifest / favicon / apple-touch-icon が参照するアプリアイコン。
       maskable 対応のため背景を全面塗り、要素は中央の安全域(内側80%)に収める。 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#0a5cf0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- タイムライン軸 + 予定Blockの3本バー(タスクシュート/計画)-->
  <circle cx="150" cy="168" r="20" fill="#ffffff"/>
  <circle cx="150" cy="256" r="20" fill="#ffffff"/>
  <circle cx="150" cy="344" r="20" fill="#ffffff"/>
  <rect x="128" y="180" width="44" height="152" rx="22" fill="#ffffff" opacity="0.55"/>
  <rect x="198" y="150" width="176" height="36" rx="18" fill="#ffffff"/>
  <rect x="198" y="238" width="140" height="36" rx="18" fill="#ffffff" opacity="0.85"/>
  <rect x="198" y="326" width="164" height="36" rx="18" fill="#ffffff" opacity="0.7"/>
  <!-- 完了チェック -->
  <path d="M300 300 l34 34 l70 -86" fill="none" stroke="#22c55e" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
